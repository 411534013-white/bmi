<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BMI 計算機</title>
<style>
  body { font-family: "Segoe UI", "Microsoft JhengHei", sans-serif; max-width: 480px; margin: 40px auto; padding: 0 16px; color: #16343b; background: #fffdf8; }
  header { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
  h1 { font-size: 1.6rem; }
  button.lang { padding: 6px 12px; border: 1px solid #087e8b; background: #fff; color: #087e8b; border-radius: 8px; cursor: pointer; font: inherit; }
  label { display: block; margin: 12px 0 4px; font-weight: 700; }
  input { width: 100%; padding: 8px; font-size: 1rem; box-sizing: border-box; }
  button.calc { margin-top: 16px; padding: 10px 20px; font-size: 1rem; background: #087e8b; color: #fff; border: none; border-radius: 8px; cursor: pointer; }
  #result { margin-top: 20px; padding: 12px; border: 2px solid #cbded9; border-radius: 10px; background: #edf7f3; min-height: 3em; }
  #bmi { font-size: 1.4rem; font-weight: 700; }
  .note { font-size: .85rem; color: #526b70; }
</style>
</head>
<body>
  <header>
    <h1 id="title">BMI 計算機</h1>
    <button id="lang" class="lang" type="button">English</button>
  </header>
  <p class="note" id="intro">輸入身高（公分）與體重（公斤），算出 BMI 與分級。</p>

  <label for="height" id="label-height">身高（公分）</label>
  <input id="height" type="number" min="50" max="250" placeholder="例如 170">

  <label for="weight" id="label-weight">體重（公斤）</label>
  <input id="weight" type="number" min="10" max="300" placeholder="例如 65">

  <button id="calc" class="calc" type="button">計算 BMI</button>

  <div id="result"><span class="note" id="hint">按下「計算 BMI」後顯示結果。</span></div>

<script>
  var lang = "zh";
  var TEXT = {
    zh: {
      pageTitle: "BMI 計算機", langBtn: "English", docLang: "zh-Hant-TW",
      intro: "輸入身高（公分）與體重（公斤），算出 BMI 與分級。",
      height: "身高（公分）", weight: "體重（公斤）",
      heightPh: "例如 170", weightPh: "例如 65",
      calc: "計算 BMI", hint: "按下「計算 BMI」後顯示結果。",
      bad: "請輸入有效的身高與體重。", your: "你的 BMI 是 ", gradeLabel: "分級：",
      grades: { under: "過輕", normal: "健康體位", over: "過重", obese: "肥胖" }
    },
    en: {
      pageTitle: "BMI Calculator", langBtn: "中文", docLang: "en",
      intro: "Enter height (cm) and weight (kg) to calculate your BMI and category.",
      height: "Height (cm)", weight: "Weight (kg)",
      heightPh: "e.g. 170", weightPh: "e.g. 65",
      calc: "Calculate BMI", hint: 'Press "Calculate BMI" to see the result.',
      bad: "Please enter a valid height and weight.", your: "Your BMI is ", gradeLabel: "Category: ",
      grades: { under: "Underweight", normal: "Healthy weight", over: "Overweight", obese: "Obese" }
    }
  };

  function gradeKey(bmi) {
    if (bmi < 18.5) return "under";
    if (bmi < 24) return "normal";
    if (bmi < 27) return "over";
    return "obese";
  }

  function applyLang() {
    var t = TEXT[lang];
    document.documentElement.lang = t.docLang;
    document.title = t.pageTitle;
    document.getElementById("title").textContent = t.pageTitle;
    document.getElementById("lang").textContent = t.langBtn;
    document.getElementById("intro").textContent = t.intro;
    document.getElementById("label-height").textContent = t.height;
    document.getElementById("label-weight").textContent = t.weight;
    document.getElementById("height").placeholder = t.heightPh;
    document.getElementById("weight").placeholder = t.weightPh;
    document.getElementById("calc").textContent = t.calc;
    document.getElementById("hint").textContent = t.hint;
  }

  document.getElementById("lang").addEventListener("click", function () {
    lang = lang === "zh" ? "en" : "zh";
    applyLang();
  });

  document.getElementById("calc").addEventListener("click", function () {
    var t = TEXT[lang];
    var h = parseFloat(document.getElementById("height").value);
    var w = parseFloat(document.getElementById("weight").value);
    var box = document.getElementById("result");
    if (!h || !w || h <= 0 || w <= 0) {
      box.innerHTML = '<span class="note">' + t.bad + "</span>";
      return;
    }
    var bmi = w / Math.pow(h / 100, 2);
    box.innerHTML = t.your + '<span id="bmi">' + bmi.toFixed(1) + "</span><br>" +
      t.gradeLabel + t.grades[gradeKey(bmi)];
  });

  applyLang();
</script>
</body>
</html>
